executor: slurm
jobs: 8

printshellcmds: true
verbose: false
latency-wait: 60
max-jobs-per-second: 5
keep-going: true
show-failed-logs: true

software-deployment-method: ["apptainer"]
apptainer-args: >-
  --bind /home/PERSONALE:/home/PERSONALE
  --bind /scratch:/scratch
  --bind /archive:/archive
  --bind /archive/extra/daniel.remondini2/bioinf_db/databases/gtdb_r232/gtdbtk_r232.squashfs:/gtdb_data:image-src=/
  --cleanenv
  --nv
  --env CHECKM_DATA_PATH=/archive/extra/daniel.remondini2/bioinf_db/databases/checkm1
  --env GTDBTK_DATA_PATH=/gtdb_data

resources:
  - gpu_slot=1

default-resources:
  - slurm_account=applicata
  - runtime=30
  - qos=normal
  - mem_mb=2000
  - slurm_requeue=false

slurm-jobname-prefix: "smk"
slurm-logdir: "logs/slurm"
slurm-keep-successful-logs: false
